name: WebOS build
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  TOOLCHAIN_REVISION: a38c582ea397fec612811f8e933ae982d41fc5a3
  TOOLCHAIN_DIR: /opt/arm-webos-linux-gnueabi_sdk-buildroot
  TOOLCHAIN_ENV_FILE: /opt/arm-webos-linux-gnueabi_sdk-buildroot/environment-setup
  TOOLCHAIN_FILE: /opt/arm-webos-linux-gnueabi_sdk-buildroot/share/buildroot/toolchainfile.cmake
  BUILD_DIR: build

  CCACHE_CACHE_DIR: .ccache-build
  CCACHE_COMPRESS: true
  CCACHE_COMPRESSLEVEL: 6
  CCACHE_MAXSIZE: 600M

jobs:

  build_sdk:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ github.workspace }}/buildroot-nc4

    steps:
      - name: Restore toolchain cache
        id: cache-toolchain-restore
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/buildroot-nc4/output/images/*_sdk-buildroot*.tar.gz
          key: toolchain-${{ runner.os }}-${{ env.TOOLCHAIN_REVISION }}

      - uses: actions/checkout@v7
        if: steps.cache-toolchain-restore.outputs.cache-hit != 'true'
        with:
          repository: openlgtv/buildroot-nc4
          ref: ${{ env.TOOLCHAIN_REVISION }}
          path: ${{ github.workspace }}/buildroot-nc4
          fetch-depth: 0

      - name: Prepare Environment
        if: steps.cache-toolchain-restore.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}/buildroot-nc4
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cpio rsync bc
          make webos_tv_defconfig
          echo "BR2_PACKAGE_QT5=n" >> .config
          echo "BR2_PACKAGE_QT6=y" >> .config
          echo "BR2_PACKAGE_QT6BASE_NETWORK=y" >> .config
          echo "BR2_PACKAGE_QT6SERIALPORT=y" >> .config
          echo "BR2_PACKAGE_ICU=n" >> .config
          wget https://gist.githubusercontent.com/sundermann/eec535ef79adb87367a6030f713d5e27/raw/20b9add1b41e0c0c55dd11aaeff41160eebe9693/em_aarch64.patch -O package/qt6/qt6base/em_aarch64.patch
          wget https://gist.githubusercontent.com/sundermann/eec535ef79adb87367a6030f713d5e27/raw/20b9add1b41e0c0c55dd11aaeff41160eebe9693/statvfs.patch -O package/qt6/qt6base/statvfs.patch
          make olddefconfig

      - name: Build SDK
        if: steps.cache-toolchain-restore.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}/buildroot-nc4
        run: |
          make sdk

      - name: Cache toolchain
        if: steps.cache-toolchain-restore.outputs.cache-hit != 'true'
        id: cache-toolchain
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/buildroot-nc4/output/images/*_sdk-buildroot*.tar.gz
          key: toolchain-${{ runner.os }}-${{ env.TOOLCHAIN_REVISION }}

  build_hyperhdr:
    needs: build_sdk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./hyperhdr-repo

    steps:
      - uses: actions/checkout@v7
        with:
          repository: awawa-dev/HyperHDR
          ref: v22.0.0.0
          path: hyperhdr-repo
          submodules: recursive
          fetch-depth: 0

      - name: Restore/Cache build directories
        uses: actions/cache@v6
        with:
          path: |
            ${{ github.workspace }}/${{ env.CCACHE_CACHE_DIR }}

          key: ccache-${{ runner.os }}-${{github.run_id}}
          restore-keys: |
            ccache-${{ runner.os }}

      - name: Create build directories
        run: |
          mkdir -p ./${{ env.BUILD_DIR }}

      - name: Restore toolchain cache
        id: cache-toolchain-restore
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/buildroot-nc4/output/images/*_sdk-buildroot*.tar.gz
          key: toolchain-${{ runner.os }}-${{ env.TOOLCHAIN_REVISION }}

      - name: Unpack toolchain
        working-directory: /opt
        run: |
          cp ${{ github.workspace }}/buildroot-nc4/output/images/*_sdk-buildroot*.tar.gz toolchain.tar.gz
          tar xf toolchain.tar.gz
          pushd ${TOOLCHAIN_DIR}
          ./relocate-sdk.sh
          popd
          find ${TOOLCHAIN_DIR}/bin -type f -iname "perl*" -delete

      - name: Install native dependencies
        env:
          apt_deps: ccache git cmake build-essential flatbuffers-compiler
        run: |
          sudo apt update
          sudo apt install -y ${{ env.apt_deps }}

      - name: Build (webos arm)
        env:
          CCACHE_DIR: ${{ github.workspace }}/${{ env.CCACHE_CACHE_DIR }}
        run: |
          pushd ./${{ env.BUILD_DIR }}
          cmake .. \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_TOOLCHAIN_FILE=${TOOLCHAIN_FILE} \
            -DCMAKE_BUILD_TYPE=Release \
            -DPLATFORM=linux \
            -DENABLE_SPI_FTDI=ON \
            -DENABLE_SPIDEV=ON \
            -DENABLE_V4L2=OFF \
            -DENABLE_X11=OFF \
            -DENABLE_PIPEWIRE=OFF \
            -DENABLE_SOUNDCAPLINUX=OFF \
            -DENABLE_CEC=OFF \
            -DENABLE_PROTOBUF=OFF \
            -DENABLE_FRAMEBUFFER=OFF \
            -DENABLE_POWER_MANAGEMENT=OFF
          make
          popd

      - name: Copy built binaries to release/
        run: |
          mkdir ./release
          cp -r ./${{ env.BUILD_DIR }}/bin/* ./release/
          find ./release

      - name: Copy dependencies to release/
        env:
          dependency_libs: libQt6Core.so.6 libQt6Network.so.6 libQt6SerialPort.so.6 libatomic.so.1 libcrypto.so.3 libftdi1.so.2 libjpeg.so.8 libpng16.so.16 libpcre2-16.so.0 libssl.so.1.1 libssl.so.3 libstdc++.so.6 libturbojpeg.so.0 libudev.so.1 libusb-1.0.so.0 libz.so.1 libdouble-conversion.so.3 libb2.so.1
        run: |
          for i in ${{ env.dependency_libs }}; do find ${TOOLCHAIN_DIR}/arm-webos-linux-gnueabi/sysroot/ -name $i -exec cp {} ./release/ \;; done
          mkdir -p ./release/tls
          cp ${TOOLCHAIN_DIR}/arm-webos-linux-gnueabi/sysroot/usr/lib/qt6/plugins/tls/libqopensslbackend.so ./release/tls/
          find ./release

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: hyperhdr-build
          path: ${{ github.workspace }}/hyperhdr-repo/release/*
          if-no-files-found: error

  build_ipk:
    runs-on: ubuntu-latest
    needs: build_hyperhdr

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/download-artifact@v8
        with:
          name: hyperhdr-build
          path: hyperhdr-build

      - name: Display structure of downloaded files
        run: ls -R

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 14.x

      - name: Restore toolchain cache
        id: cache-toolchain-restore
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/buildroot-nc4/output/images/*_sdk-buildroot*.tar.gz
          key: toolchain-${{ runner.os }}-${{ env.TOOLCHAIN_REVISION }}

      - name: Unpack toolchain
        working-directory: /opt
        run: |
          cp ${{ github.workspace }}/buildroot-nc4/output/images/*_sdk-buildroot*.tar.gz toolchain.tar.gz
          tar xf toolchain.tar.gz
          pushd ${TOOLCHAIN_DIR}
          ./relocate-sdk.sh
          popd
          find ${TOOLCHAIN_DIR}/bin -type f -iname "perl*" -delete

      - name: Install native dependencies
        env:
          apt_deps: cmake build-essential
        run: |
          sudo apt update
          sudo apt install -y ${{ env.apt_deps }}

      - name: Reconfigure git to use HTTP authentication
        run: >
          git config --global url."https://github.com/".insteadOf
          ssh://git@github.com/

      - run: npm ci
      - run: npm run lint
      - run: npm run build -- --env production
      - name: Build service
        run: |
          mkdir -p ./dist/service
          rm -rf ./dist/service/*
          mkdir -p ./service/build
          pushd service/build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=${TOOLCHAIN_FILE}
          make -j$(nproc)
          popd
          cp -r ./service/build/dist/* ./dist/service/

      - name: Copy hyperhdr into dist/service/hyperhdr
        run: |
          ls -R
          mkdir -p ./dist/service/hyperhdr
          cp -r ./hyperhdr-build/* ./dist/service/hyperhdr/
          ls -R

      - name: Ensure executables +x
        run: |
          chmod +x ./dist/service/autostart.sh
          chmod +x ./dist/service/loader_service
          chmod +x ./dist/service/start_hyperhdr
          chmod +x ./dist/service/hyperhdr/hyperhdr

      - name: Copy HDR LUT
        run: |
          unxz -dc ./resources/lut_lin_tables.3d.zst.xz > ./dist/service/hyperhdr/lut_lin_tables.3d.zst
          unxz -dc ./resources/lut_lin_tables_dv.3d.zst.xz > ./dist/service/hyperhdr/lut_lin_tables_dv.3d.zst
          unxz -dc ./resources/lut_lin_tables_hdr.3d.zst.xz > ./dist/service/hyperhdr/lut_lin_tables_hdr.3d.zst

      - run: npm run package
      - run: npm run gen-manifest

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: hyperhdr-ipk
          path: |
            ${{github.workspace}}/*.ipk

      - uses: marvinpinto/action-automatic-releases@latest
        if: "github.ref == 'refs/heads/master'"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: latest
          prerelease: true
          title: "Development Build"
          files: |
            ${{github.workspace}}/*.ipk
            ${{github.workspace}}/org.webosbrew.hyperhdr.loader.manifest.json

      - uses: marvinpinto/action-automatic-releases@latest
        if: "startsWith(github.ref, 'refs/tags/v')"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: false
          title: ${{ github.ref_name }}
          files: |
            ${{github.workspace}}/*.ipk
            ${{github.workspace}}/org.webosbrew.hyperhdr.loader.manifest.json
